; Сборка:   pio run -e esp32dev          (ESP32 DevKit + модуль RS485)
;           pio run -e tcan485           (LilyGO T-CAN485)
; Прошивка: pio run -e <env> -t upload
; Лог:      pio device monitor

[platformio]
default_envs = esp32dev

[env]
platform = espressif32@6.9.0
framework = arduino
board = esp32dev
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient@^2.8

[env:esp32dev]

[env:tcan485]
build_flags = -DBOARD_TCAN485
